<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="Control operativo MSR/HCE: reparto, estados, contenedores e importaciones.">
  <title>MSR · HCE Control</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <script defer src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script defer src="./cloud-config.js"></script>
  <script defer src="./cloud.js"></script>
  <script defer src="./app.js"></script>
</head>
<body>
  <div id="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark"><span>↔</span></div>
        <div><strong>MSR · HCE</strong><small>Live Control · Operativa</small></div>
      </div>

      <nav class="nav" id="nav">
        <button data-page="inicio" class="active">🏠 <span>Inicio</span></button>
        <button data-page="resumen">📊 <span>Resumen MSR</span></button>
        <button data-page="hce">🚛 <span>Contenedores HCE</span></button>
        <button data-page="import-msr">📥 <span>Importar MSR</span></button>
        <button data-page="import-hce">📥 <span>Importar HCE</span></button>
        <button data-page="datos">💾 <span>Datos / copias</span></button>
      </nav>

      <div class="sidebar-footer">
        <span class="dot ok"></span>
        <small>Control operativo MSR / HCE</small>
      </div>
    </aside>

    <main>
      <header class="topbar">
        <button class="icon-btn mobile-only" id="menuBtn" aria-label="Menú">☰</button>
        <div>
          <h1 id="pageTitle">Inicio</h1>
          <p id="pageSubtitle">Centro de mando MSR / HCE</p>
        </div>
        <div class="top-actions">
          <button class="btn ghost" id="installBtn" hidden>📲 Instalar app</button>
          <button class="btn admin-quick-btn" id="quickAdminBtn">🔐 Admin</button>
          <button class="btn ghost" id="recalcBtn">↻ Actualizar</button>
        </div>
      </header>
      <div id="appUpdateBanner" class="app-update-banner" hidden>
        <div class="app-update-copy">
          <span class="app-update-icon">✨</span>
          <div>
            <strong>Nueva actualización disponible</strong>
            <small>Hay una versión más reciente de MSR · HCE Control lista para instalar.</small>
          </div>
        </div>
        <div class="app-update-actions">
          <button class="btn update-now-btn" id="applyUpdateBtn">⚡ Actualizar ahora</button>
          <button class="update-later-btn" id="dismissUpdateBtn" aria-label="Más tarde">Más tarde</button>
        </div>
      </div>
      <div id="syncBanner" class="sync-banner">
        <div class="sync-left">
          <span id="syncDot" class="sync-dot checking"></span>
          <div>
            <strong id="syncTitle">Comprobando conexión…</strong>
            <small id="syncDetail">Preparando sincronización</small>
          </div>
        </div>
        <button class="btn sync-btn" id="forceSyncBtn">↻ Forzar sincronización</button>
      </div>

      <div id="toast" class="toast" aria-live="polite"></div>
      <section id="content" class="content"></section>
    </main>
  </div>

</body>
</html>
